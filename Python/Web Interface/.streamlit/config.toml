[server]
# Porta fissa per la web interface
# Cambia questo valore con la tua porta disponibile (es: 8080, 8501, 5000, etc.)
port = 21002

# Permetti accesso da remoto (0.0.0.0 = tutte le interfacce)
address = "0.0.0.0"

# Modalità headless (per server senza GUI)
headless = true

[browser]
# Non raccogliere statistiche di utilizzo
gatherUsageStats = false

# Non aprire automaticamente il browser
serverAddress = "0.0.0.0"
serverPort = 21002
